<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathLern – Klasse 8 Mathematik</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#7c3aed;--primary-light:#a78bfa;--primary-dark:#5b21b6;--primary-bg:#f5f3ff;--accent:#f59e0b;--accent-light:#fef3c7;--success:#10b981;--success-light:#d1fae5;--error:#ef4444;--error-light:#fee2e2;--info:#3b82f6;--info-light:#dbeafe;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--gray-900:#0f172a;--radius:12px;--radius-sm:8px;--shadow:0 4px 6px -1px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);--shadow-xl:0 20px 25px -5px rgba(0,0,0,.1);}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh;}
button{cursor:pointer;font-family:inherit;}
input,select{font-family:inherit;}
.hidden{display:none!important;}
#loginScreen{min-height:100vh;background:linear-gradient(135deg,#5b21b6,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-container{background:white;border-radius:24px;padding:48px 40px;width:100%;max-width:440px;box-shadow:0 25px 50px rgba(0,0,0,.25);}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .logo-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;}
.login-logo h1{font-size:28px;font-weight:800;color:var(--primary-dark);}
.login-logo p{color:var(--gray-500);font-size:14px;margin-top:4px;}
.login-tabs{display:flex;background:var(--gray-100);border-radius:var(--radius-sm);padding:4px;margin-bottom:28px;}
.login-tab{flex:1;padding:10px;border:none;background:transparent;border-radius:6px;font-size:14px;font-weight:600;color:var(--gray-500);transition:all .2s;}
.login-tab.active{background:white;color:var(--primary);box-shadow:var(--shadow);}
.form-group{margin-bottom:20px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;}
.form-group input,.form-group select{width:100%;padding:12px 16px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);font-size:15px;outline:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;}
.login-error{background:var(--error-light);color:var(--error);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:none;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:linear-gradient(180deg,#4c1d95,#5b21b6);color:white;display:flex;flex-direction:column;z-index:100;}
.sidebar-header{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-logo{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sidebar-logo .logo-sm{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.sidebar-logo span{font-size:18px;font-weight:800;}
.user-info{background:rgba(255,255,255,.1);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px;}
.user-avatar{width:36px;height:36px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;}
.user-name{font-size:13px;font-weight:700;}
.user-role{font-size:11px;opacity:.7;}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.5;padding:0 8px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;font-size:14px;font-weight:500;color:rgba(255,255,255,.8);border:none;background:transparent;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,.1);color:white;}
.nav-item.active{background:rgba(255,255,255,.2);color:white;font-weight:700;}
.nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--accent);color:white;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;}
.progress-mini{margin-left:auto;width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;}
.progress-mini-fill{height:100%;background:var(--success);border-radius:2px;transition:width .3s;}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.1);}
.btn-logout{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:rgba(255,255,255,.1);border:none;border-radius:var(--radius-sm);color:rgba(255,255,255,.8);font-size:13px;font-weight:600;}
.main-content{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:white;border-bottom:1px solid var(--gray-200);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:20px;font-weight:800;color:var(--gray-900);}
.topbar-subtitle{font-size:13px;color:var(--gray-500);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:12px;}
.content-area{flex:1;padding:32px;}
.view{display:none;}
.view.active{display:block;}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:32px;}
.stat-card{background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--gray-100);display:flex;align-items:center;gap:16px;}
.stat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.stat-icon.purple{background:var(--primary-bg);}
.stat-icon.green{background:var(--success-light);}
.stat-icon.amber{background:var(--accent-light);}
.stat-icon.blue{background:var(--info-light);}
.stat-value{font-size:28px;font-weight:800;color:var(--gray-900);}
.stat-label{font-size:13px;color:var(--gray-500);margin-top:2px;}
.section-title{font-size:18px;font-weight:800;color:var(--gray-900);margin-bottom:16px;}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:32px;}
.module-card{background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--gray-100);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.module-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--primary-light));}
.module-icon{font-size:32px;}
.module-title{font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:6px;}
.module-desc{font-size:13px;color:var(--gray-500);line-height:1.5;margin-bottom:16px;}
.progress-bar{height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:3px;transition:width .5s;}
.progress-text{font-size:12px;color:var(--gray-500);margin-top:4px;}
.lesson-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:white;border-radius:var(--radius);padding:28px 32px;margin-bottom:24px;}
.lesson-title{font-size:26px;font-weight:800;margin-bottom:8px;}
.lesson-meta{display:flex;gap:20px;font-size:13px;opacity:.8;}
.lesson-tabs{display:flex;gap:4px;background:white;border-radius:var(--radius);padding:6px;box-shadow:var(--shadow);margin-bottom:24px;flex-wrap:wrap;}
.lesson-tab{flex:1;min-width:120px;padding:10px 16px;border:none;background:transparent;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--gray-500);transition:all .2s;}
.lesson-tab.active{background:var(--primary);color:white;}
.lesson-content{display:none;}
.lesson-content.active{display:block;}
.merkebox{background:linear-gradient(135deg,#fef3c7,#fffbeb);border:2px solid var(--accent);border-radius:var(--radius);padding:20px 24px;margin:20px 0;position:relative;}
.merkebox::before{content:'📌 Merke';position:absolute;top:-12px;left:16px;background:var(--accent);color:white;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.merkebox h4{font-size:15px;font-weight:700;color:#92400e;margin-bottom:8px;}
.merkebox p,.merkebox ul{font-size:14px;color:#78350f;line-height:1.7;}
.merkebox ul{padding-left:20px;}
.beispiel-box{background:var(--primary-bg);border:2px solid var(--primary-light);border-radius:var(--radius);padding:20px 24px;margin:20px 0;position:relative;}
.beispiel-box::before{content:'💡 Beispiel';position:absolute;top:-12px;left:16px;background:var(--primary);color:white;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.beispiel-box h4{font-size:14px;font-weight:700;color:var(--primary-dark);margin-bottom:10px;}
.beispiel-box .calc{font-family:'Courier New',monospace;font-size:15px;color:var(--primary-dark);line-height:1.8;}
.exercise-card{background:white;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);border:1px solid var(--gray-100);margin-bottom:24px;}
.btn-check{padding:10px 20px;background:var(--primary);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;}
.feedback-box{margin-top:12px;padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;display:none;}
.feedback-box.correct{background:var(--success-light);color:#065f46;}
.feedback-box.incorrect{background:var(--error-light);color:#991b1b;}
.btn-hint{padding:8px 16px;background:var(--accent-light);color:#92400e;border:1px solid var(--accent);border-radius:var(--radius-sm);font-size:13px;font-weight:600;}
.btn-solution{padding:8px 16px;background:var(--info-light);color:#1e40af;border:1px solid #93c5fd;border-radius:var(--radius-sm);font-size:13px;font-weight:600;}
.hint-box{margin-top:12px;padding:14px 18px;background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-sm);font-size:14px;color:#78350f;display:none;}
.solution-box{margin-top:12px;padding:14px 18px;background:var(--info-light);border:1px solid #93c5fd;border-radius:var(--radius-sm);font-size:14px;color:#1e3a8a;display:none;}
.mc-options{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.mc-option{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;}
.mc-option.correct{border-color:var(--success);background:var(--success-light);}
.mc-option.incorrect{border-color:var(--error);background:var(--error-light);}
.progress-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:32px;}
.progress-module-card{background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
.sign-table{border-collapse:collapse;margin:12px auto;font-size:15px;}
.sign-table td,.sign-table th{padding:10px 20px;border:2px solid var(--gray-200);text-align:center;}
.sign-table th{background:var(--primary);color:white;}
.sign-table .pos{color:var(--success);font-weight:800;font-size:18px;}
.sign-table .neg{color:var(--error);font-weight:800;font-size:18px;}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{color:white;padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;max-width:320px;}
.toast.success{background:var(--success);}
.toast.error{background:var(--error);}
.toast.info{background:var(--info);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:var(--radius);width:100%;max-width:700px;max-height:85vh;display:flex;flex-direction:column;}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;}
.modal-body{flex:1;overflow-y:auto;padding:24px;}
.modal-tab{padding:8px 16px;border:none;background:var(--gray-100);border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--gray-600);}
.modal-tab.active{background:var(--primary);color:white;}
.timer-display{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--gray-600);background:var(--gray-100);padding:6px 12px;border-radius:20px;}
.lerncheck-bar{flex:1;height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden;}
.lerncheck-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width .5s;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--gray-50);padding:10px 14px;text-align:left;font-weight:700;color:var(--gray-600);border-bottom:2px solid var(--gray-200);}
td{padding:10px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-700);}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.green{background:var(--success-light);color:#065f46;}
.badge.amber{background:var(--accent-light);color:#92400e;}
.badge.red{background:var(--error-light);color:#991b1b;}
.badge.gray{background:var(--gray-100);color:var(--gray-600);}
.btn-secondary{padding:10px 20px;background:white;color:var(--primary);border:2px solid var(--primary);border-radius:var(--radius-sm);font-size:14px;font-weight:700;}
.btn-danger{padding:6px 12px;background:var(--error-light);color:var(--error);border:1px solid #fca5a5;border-radius:var(--radius-sm);font-size:12px;font-weight:600;}
.btn-sm{padding:6px 12px;background:var(--primary-bg);color:var(--primary);border:1px solid var(--primary-light);border-radius:var(--radius-sm);font-size:12px;font-weight:600;}
.fade-in{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@media(max-width:768px){.sidebar{transform:translateX(-100%);}  .main-content{margin-left:0;}.content-area{padding:16px;}.topbar{padding:12px 16px;}}
</style>
</head>
<body>
<div id="loginScreen">
<div class="login-container">
<div class="login-logo">
<div class="logo-icon">🧮</div>
<h1>MathLern</h1>
<p>Klasse 8 Mathematik – Interaktive Lernplattform</p>
</div>
<div class="login-tabs">
<button class="login-tab" onclick="switchLoginTab('login')">Anmelden</button>
<button class="login-tab active" onclick="switchLoginTab('register')">Registrieren</button>
</div>
<div id="loginError" class="login-error"></div>
<div id="loginForm" style="display:none;">
<div class="form-group"><label>Benutzername</label><input type="text" id="loginUsername" placeholder="z.B. anna.mueller"></div>
<div class="form-group"><label>Passwort</label><input type="password" id="loginPassword" placeholder="Passwort eingeben"></div>
<button class="btn-primary" onclick="doLogin()">Anmelden →</button>
</div>
<div id="registerForm">
<div class="form-group"><label>Vorname</label><input type="text" id="regFirstname" placeholder="Vorname"></div>
<div class="form-group"><label>Nachname</label><input type="text" id="regLastname" placeholder="Nachname"></div>
<div class="form-group"><label>Benutzername (automatisch)</label><input type="text" id="regUsername" readonly style="background:var(--gray-50);"></div>
<div class="form-group"><label>Passwort</label><input type="password" id="regPassword" placeholder="Mindestens 6 Zeichen"></div>
<div class="form-group"><label>Klasse</label>
<select id="regClass"><option value="8a">Klasse 8a</option><option value="8b">Klasse 8b</option><option value="8c">Klasse 8c</option><option value="8d">Klasse 8d</option></select></div>
<button class="btn-primary" onclick="doRegister()">Konto erstellen →</button>
</div>
</div>
</div>
<div id="app" style="display:none;">
<nav class="sidebar" id="sidebar">
<div class="sidebar-header">
<div class="sidebar-logo"><div class="logo-sm">🧮</div><span>MathLern</span></div>
<div class="user-info">
<div class="user-avatar" id="sidebarAvatar">?</div>
<div><div class="user-name" id="sidebarName">Laden...</div><div class="user-role" id="sidebarRole">Schüler/in</div></div>
</div>
</div>
<div class="sidebar-nav">
<div class="nav-section">
<div class="nav-section-title">Übersicht</div>
<button class="nav-item active" onclick="showView('dashboard')" id="nav-dashboard"><span class="nav-icon">🏠</span> Dashboard</button>
<button class="nav-item" onclick="showView('progress')" id="nav-progress"><span class="nav-icon">📊</span> Mein Fortschritt</button>
</div>
<div class="nav-section">
<div class="nav-section-title">📘 Rationale Zahlen</div>
<button class="nav-item" onclick="openModule('erkennen')" id="nav-erkennen"><span class="nav-icon">🔢</span><span style="flex:1;">Erkennen &amp; Vergleichen</span><div class="progress-mini"><div class="progress-mini-fill" id="prog-erkennen" style="width:0%"></div></div></button>
<button class="nav-item" onclick="openModule('addieren')" id="nav-addieren"><span class="nav-icon">➕</span><span style="flex:1;">Addieren &amp; Subtrahieren</span><div class="progress-mini"><div class="progress-mini-fill" id="prog-addieren" style="width:0%"></div></div></button>
<button class="nav-item" onclick="openModule('multiplizieren')" id="nav-multiplizieren"><span class="nav-icon">✖️</span><span style="flex:1;">Multiplizieren &amp; Dividieren</span><div class="progress-mini"><div class="progress-mini-fill" id="prog-multiplizieren" style="width:0%"></div></div></button>
<button class="nav-item" onclick="openModule('vorrang')" id="nav-vorrang"><span class="nav-icon">📐</span><span style="flex:1;">Rechenregeln &amp; Vorrang</span><div class="progress-mini"><div class="progress-mini-fill" id="prog-vorrang" style="width:0%"></div></div></button>
<button class="nav-item" onclick="openModule('gesetze')" id="nav-gesetze"><span class="nav-icon">⚖️</span><span style="flex:1;">Rechengesetze</span><div class="progress-mini"><div class="progress-mini-fill" id="prog-gesetze" style="width:0%"></div></div></button>
<button class="nav-item" onclick="openModule('lerncheck')" id="nav-lerncheck"><span class="nav-icon">✅</span><span style="flex:1;">Lerncheck</span><span class="nav-badge">TEST</span></button>
</div>
<div class="nav-section" id="teacherNav" style="display:none;">
<div class="nav-section-title">👩‍🏫 Lehrerbereich</div>
<button class="nav-item" onclick="showView('teacher')" id="nav-teacher"><span class="nav-icon">📊</span> Auswertung</button>
<button class="nav-item" onclick="showView('manage')" id="nav-manage"><span class="nav-icon">👥</span> Schüler verwalten</button>
</div>
</div>
<div class="sidebar-footer">
<button class="btn-logout" onclick="doLogout()"><span>🚪</span> Abmelden</button>
</div>
</nav>
<div class="main-content">
<div class="topbar">
<div>
<div class="topbar-title" id="topbarTitle">Dashboard</div>
<div class="topbar-subtitle" id="topbarSubtitle">Willkommen zurück!</div>
</div>
<div class="topbar-actions">
<div class="timer-display" id="timerDisplay" style="display:none;">⏱️ <span id="timerText">00:00</span></div>
<button class="btn-secondary" onclick="openHelpModal()" style="padding:8px 16px;font-size:13px;">❓ Hilfe</button>
</div>
</div>
<div class="content-area">
<div class="view active fade-in" id="view-dashboard">
<div class="dashboard-grid" id="dashboardStats"></div>
<div class="section-title">📚 Lernmodule – Rationale Zahlen</div>
<div class="modules-grid" id="modulesGrid"></div>
<div class="section-title">🕐 Zuletzt bearbeitet</div>
<div id="recentActivity" style="background:white;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-height:60px;"></div>
</div>
<div class="view fade-in" id="view-progress">
<div class="progress-overview" id="progressOverview"></div>
<div id="progressDetails" style="background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);"></div>
</div>
<div class="view fade-in" id="view-module"><div id="moduleContent"></div></div>
<div class="view fade-in" id="view-teacher"><div id="teacherContent"></div></div>
<div class="view fade-in" id="view-manage"><div id="manageContent"></div></div>
</div>
</div>
</div>
<div class="modal-overlay" id="helpModal">
<div class="modal">
<div class="modal-header">
<h3 style="font-size:18px;font-weight:800;">📚 Hilfe & Erklärungen</h3>
<button onclick="closeHelpModal()" style="width:32px;height:32px;border:none;background:var(--gray-100);border-radius:50%;font-size:18px;">✕</button>
</div>
<div class="modal-body">
<div id="helpTabs" style="display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;"></div>
<div id="helpContent"></div>
</div>
</div>
</div>

function doRegister(){const fn=document.getElementById('regFirstname').value.trim();const ln=document.getElementById('regLastname').value.trim();const pw=document.getElementById('regPassword').value;const cls=document.getElementById('regClass').value;if(!fn||!ln||!pw){showLoginError('Bitte alle Felder ausfüllen.');return;}if(pw.length<6){showLoginError('Passwort mind. 6 Zeichen.');return;}const username=(fn+'.'+ln).toLowerCase().replace(/\s/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');const users=DB.get('users')||[];if(users.find(u=>u.username===username)){showLoginError('Benutzername vergeben.');return;}const newUser={id:'u'+Date.now(),username,password:pw,role:'student',name:fn+' '+ln,class:cls,firstname:fn,lastname:ln};users.push(newUser);DB.set('users',users);currentUser=newUser;DB.set('currentUser',newUser.id);startApp();}

function startTimer(){stopTimer();sessionSeconds=0;sessionTimer=setInterval(()=>{sessionSeconds++;const m=Math.floor(sessionSeconds/60).toString().padStart(2,'0');const s=(sessionSeconds%60).toString().padStart(2,'0');document.getElementById('timerText').textContent=m+':'+s;if(sessionSeconds%30===0)saveSessionTime();},1000);}

function saveSessionTime(){if(!currentUser)return;const sessions=DB.get('sessions')||{};if(!sessions[currentUser.id])sessions[currentUser.id]=[];const today=new Date().toISOString().split('T')[0];const ex=sessions[currentUser.id].find(s=>s.date===today);if(ex)ex.seconds=(ex.seconds||0)+30;else sessions[currentUser.id].push({date:today,seconds:sessionSeconds});DB.set('sessions',sessions);}
function getProgress(uid){return(DB.get('progress')||{})[uid]||{};}
function getModuleProgress(uid,mid){return getProgress(uid)[mid]||{};}
function recordAnswer(moduleId,exerciseId,correct){if(!currentUser)return;const uid=currentUser.id;const all=DB.get('progress')||{};if(!all[uid])all[uid]={};if(!all[uid][moduleId])all[uid][moduleId]={correct:0,errors:0,attempts:0,hints:0,percent:0,exercises:{}};const mp=all[uid][moduleId];mp.attempts=(mp.attempts||0)+1;if(correct){mp.correct=(mp.correct||0)+1;if(!mp.exercises)mp.exercises={};mp.exercises[exerciseId]=true;}else mp.errors=(mp.errors||0)+1;const totalEx={erkennen:8,addieren:8,multiplizieren:8,vorrang:7,gesetze:6,lerncheck:10};mp.percent=Math.round(Object.keys(mp.exercises||{}).length/(totalEx[moduleId]||8)*100);DB.set('progress',all);updateSidebarProgress();}
function recordHint(mid){if(!currentUser)return;const all=DB.get('progress')||{};if(!all[currentUser.id])all[currentUser.id]={};if(!all[currentUser.id][mid])all[currentUser.id][mid]={hints:0};all[currentUser.id][mid].hints=(all[currentUser.id][mid].hints||0)+1;DB.set('progress',all);}

function showToast(msg,type='info'){const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className='toast '+type;t.innerHTML=`<span>${{success:'✅',error:'❌',info:'ℹ️'}[type]||'ℹ️'}</span> ${msg}`;c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2500);}

function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));const view=document.getElementById('view-'+v);if(view){view.classList.add('active');view.classList.add('fade-in');}const btn=document.getElementById('nav-'+v);if(btn)btn.classList.add('active');const titles={dashboard:['Dashboard','Deine Lernübersicht'],progress:['Mein Fortschritt','Auswertung'],teacher:['Lehrerauswertung','Statistiken'],manage:['Schüler verwalten','Konten']};if(titles[v]){document.getElementById('topbarTitle').textContent=titles[v][0];document.getElementById('topbarSubtitle').textContent=titles[v][1];}document.getElementById('timerDisplay').style.display=v==='module'?'flex':'none';if(v==='dashboard')renderDashboard();if(v==='progress')renderProgress();if(v==='teacher')renderTeacher();if(v==='manage')renderManage();}

function renderDashboard(){if(currentUser.role==='teacher'){renderTeacherDashboard();return;}const prog=getProgress(currentUser.id);const mods=['erkennen','addieren','multiplizieren','vorrang','gesetze'];let tc=0,ta=0,cm=0;mods.forEach(m=>{const p=prog[m]||{};tc+=p.correct||0;ta+=p.attempts||0;if((p.percent||0)>=80)cm++;});const acc=ta>0?Math.round(tc/ta*100):0;const sessions=DB.get('sessions')||{};const mins=Math.round(((sessions[currentUser.id]||[]).reduce((s,x)=>s+(x.seconds||0),0))/60);document.getElementById('dashboardStats').innerHTML=`<div class="stat-card"><div class="stat-icon purple">📚</div><div><div class="stat-value">${cm}/5</div><div class="stat-label">Module abgeschlossen</div></div></div><div class="stat-card"><div class="stat-icon green">✅</div><div><div class="stat-value">${tc}</div><div class="stat-label">Richtige Antworten</div></div></div><div class="stat-card"><div class="stat-icon amber">🎯</div><div><div class="stat-value">${acc}%</div><div class="stat-label">Trefferquote</div></div></div><div class="stat-card"><div class="stat-icon blue">⏱️</div><div><div class="stat-value">${mins}</div><div class="stat-label">Minuten gelernt</div></div></div>`;const moduleData=[{id:'erkennen',icon:'🔢',title:'Erkennen & Vergleichen',desc:'Zahlenstrahl, Betrag, Gegenzahl',tasks:8},{id:'addieren',icon:'➕',title:'Addieren & Subtrahieren',desc:'Vorzeichen, Gegenzahl addieren',tasks:8},{id:'multiplizieren',icon:'✖️',title:'Multiplizieren & Dividieren',desc:'Vorzeichenregeln',tasks:8},{id:'vorrang',icon:'📐',title:'Rechenregeln & Vorrang',desc:'Punkt vor Strich, Klammern',tasks:7},{id:'gesetze',icon:'⚖️',title:'Rechengesetze',desc:'Kommutativ-, Assoziativ-, Distributivgesetz',tasks:6},{id:'lerncheck',icon:'✅',title:'Lerncheck',desc:'Alle Themen testen',tasks:10}];document.getElementById('modulesGrid').innerHTML=moduleData.map(m=>{const p=prog[m.id]||{};const pct=p.percent||0;const status=pct===0?'Nicht begonnen':pct>=80?'✓ Abgeschlossen':'In Bearbeitung';const sc=pct===0?'#f1f5f9':pct>=80?'#d1fae5':'#fef3c7';const tc2=pct===0?'#64748b':pct>=80?'#065f46':'#92400e';return`<div onclick="openModule('${m.id}')" class="module-card"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span class="module-icon">${m.icon}</span><span style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:${sc};color:${tc2};">${status}</span></div><div class="module-title">${m.title}</div><div class="module-desc">${m.desc}</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-text">${pct}% · ${p.correct||0}/${m.tasks} richtig · ${p.errors||0} Fehler</div></div>`;}).join('');const ra=document.getElementById('recentActivity');const entries=Object.entries(prog);if(entries.length===0){ra.innerHTML='<p style="color:#64748b;font-size:14px;">Noch keine Aktivitäten. Starte ein Modul!</p>';}else{ra.innerHTML=entries.map(([mid,p])=>{const m=moduleData.find(x=>x.id===mid);if(!m)return'';return`<div onclick="openModule('${mid}')" style="display:flex;align-items:center;gap:12px;padding:10px;background:#f8fafc;border-radius:8px;cursor:pointer;margin-bottom:8px;"><span style="font-size:24px;">${m.icon}</span><div style="flex:1;"><div style="font-size:14px;font-weight:700;">${m.title}</div><div style="font-size:12px;color:#64748b;">${p.correct||0} richtig · ${p.errors||0} Fehler</div></div></div>`;}).join('');}}
function renderTeacherDashboard(){const users=(DB.get('users')||[]).filter(u=>u.role==='student');document.getElementById('dashboardStats').innerHTML=`<div class="stat-card"><div class="stat-icon purple">👥</div><div><div class="stat-value">${users.length}</div><div class="stat-label">Schüler/innen</div></div></div>`;document.getElementById('modulesGrid').innerHTML=`<div style="grid-column:1/-1;background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);text-align:center;"><div style="font-size:48px;margin-bottom:12px;">👩‍🏫</div><div style="font-size:18px;font-weight:700;margin-bottom:16px;">Willkommen im Lehrerbereich!</div><div style="display:flex;gap:12px;justify-content:center;"><button onclick="showView('teacher')" class="btn-primary" style="width:auto;padding:10px 24px;">📊 Auswertung</button><button onclick="showView('manage')" class="btn-secondary">👥 Schüler verwalten</button></div></div>`;document.getElementById('recentActivity').innerHTML='';}
function renderProgress(){if(currentUser.role==='teacher'){renderTeacher();return;}const prog=getProgress(currentUser.id);const mods=[{id:'erkennen',icon:'🔢',title:'Erkennen & Vergleichen',tasks:8},{id:'addieren',icon:'➕',title:'Addieren & Subtrahieren',tasks:8},{id:'multiplizieren',icon:'✖️',title:'Multiplizieren & Dividieren',tasks:8},{id:'vorrang',icon:'📐',title:'Rechenregeln & Vorrang',tasks:7},{id:'gesetze',icon:'⚖️',title:'Rechengesetze',tasks:6}];document.getElementById('progressOverview').innerHTML=mods.map(m=>{const p=prog[m.id]||{};const acc=p.attempts>0?Math.round((p.correct||0)/p.attempts*100):0;return`<div class="progress-module-card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;"><span style="font-size:28px;">${m.icon}</span><div><div style="font-size:16px;font-weight:700;">${m.title}</div><div style="font-size:12px;color:#64748b;">${m.tasks} Aufgaben</div></div></div><div class="progress-bar" style="margin-bottom:12px;"><div class="progress-fill" style="width:${p.percent||0}%"></div></div><div style="display:flex;flex-direction:column;gap:8px;font-size:13px;"><div style="display:flex;justify-content:space-between;"><span style="color:#64748b;">Fortschritt</span><span style="font-weight:700;">${p.percent||0}%</span></div><div style="display:flex;justify-content:space-between;"><span style="color:#64748b;">Richtig</span><span style="font-weight:700;color:#10b981;">${p.correct||0}</span></div><div style="display:flex;justify-content:space-between;"><span style="color:#64748b;">Fehlversuche</span><span style="font-weight:700;color:#ef4444;">${p.errors||0}</span></div><div style="display:flex;justify-content:space-between;"><span style="color:#64748b;">Trefferquote</span><span style="font-weight:700;color:#3b82f6;">${acc}%</span></div></div></div>`;}).join('');}
function renderTeacher(){const users=(DB.get('users')||[]).filter(u=>u.role==='student');const allProg=DB.get('progress')||{};const sessions=DB.get('sessions')||{};const mods=[{id:'erkennen',label:'Erkennen'},{id:'addieren',label:'Addieren'},{id:'multiplizieren',label:'Multiplizieren'},{id:'vorrang',label:'Vorrang'},{id:'gesetze',label:'Gesetze'}];document.getElementById('teacherContent').innerHTML=`<div style="background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">📊 Schülerübersicht</h3><div style="overflow-x:auto;"><table><thead><tr><th>Name</th><th>Klasse</th>${mods.map(m=>`<th>${m.label}</th>`).join('')}<th>Ø Quote</th><th>Zeit</th></tr></thead><tbody>${users.map(u=>{const p=allProg[u.id]||{};let tc=0,ta=0;const cells=mods.map(m=>{const mp=p[m.id]||{};tc+=mp.correct||0;ta+=mp.attempts||0;const pct=mp.percent||0;const bg=pct>=80?'#d1fae5':pct>=40?'#fef3c7':pct>0?'#fee2e2':'#f1f5f9';const col=pct>=80?'#065f46':pct>=40?'#92400e':pct>0?'#991b1b':'#64748b';return`<td><span class="badge" style="background:${bg};color:${col};">${pct}%</span></td>`;}).join('');const acc=ta>0?Math.round(tc/ta*100):0;const secs=(sessions[u.id]||[]).reduce((s,x)=>s+(x.seconds||0),0);return`<tr><td><strong>${u.name}</strong></td><td>${u.class||'–'}</td>${cells}<td style="font-weight:700;color:${acc>=70?'#10b981':acc>=40?'#f59e0b':'#ef4444'};">${acc}%</td><td>${Math.round(secs/60)} Min</td></tr>`;}).join('')}</tbody></table></div></div>`;}
function renderManage(){const users=DB.get('users')||[];const students=users.filter(u=>u.role==='student');document.getElementById('manageContent').innerHTML=`<div style="background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px;"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">➕ Neuen Schüler hinzufügen</h3><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;"><div><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Vorname</label><input type="text" id="mgrFn" placeholder="Vorname" style="padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;"></div><div><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Nachname</label><input type="text" id="mgrLn" placeholder="Nachname" style="padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;"></div><div><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Klasse</label><select id="mgrClass" style="padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;"><option value="8a">8a</option><option value="8b">8b</option><option value="8c">8c</option><option value="8d">8d</option></select></div><div><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Passwort</label><input type="text" id="mgrPw" value="schueler123" style="padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;width:140px;"></div><button onclick="addStudent()" class="btn-primary" style="width:auto;padding:10px 20px;">Hinzufügen</button></div></div><div style="background:white;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">👥 Schülerliste (${students.length})</h3><div style="overflow-x:auto;"><table><thead><tr><th>Name</th><th>Benutzername</th><th>Klasse</th><th>Passwort</th><th>Aktionen</th></tr></thead><tbody>${students.map(u=>`<tr><td><strong>${u.name}</strong></td><td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">${u.username}</code></td><td>${u.class||'–'}</td><td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">${u.password}</code></td><td><button onclick="resetProgress('${u.id}','${u.name}')" class="btn-sm">🔄 Reset</button> <button onclick="deleteStudent('${u.id}','${u.name}')" class="btn-danger">🗑️ Löschen</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function addStudent(){const fn=document.getElementById('mgrFn').value.trim();const ln=document.getElementById('mgrLn').value.trim();const cls=document.getElementById('mgrClass').value;const pw=document.getElementById('mgrPw').value.trim();if(!fn||!ln){showToast('Bitte Vor- und Nachname eingeben.','error');return;}const username=(fn+'.'+ln).toLowerCase().replace(/\s/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');const users=DB.get('users')||[];if(users.find(u=>u.username===username)){showToast('Benutzername bereits vorhanden.','error');return;}users.push({id:'u'+Date.now(),username,password:pw||'schueler123',role:'student',name:fn+' '+ln,class:cls,firstname:fn,lastname:ln});DB.set('users',users);showToast(fn+' '+ln+' hinzugefügt!','success');renderManage();}
function deleteStudent(uid,name){if(!confirm('Schüler/in "'+name+'" wirklich löschen?'))return;DB.set('users',(DB.get('users')||[]).filter(u=>u.id!==uid));const prog=DB.get('progress')||{};delete prog[uid];DB.set('progress',prog);showToast(name+' gelöscht.','info');renderManage();}
function resetProgress(uid,name){if(!confirm('Fortschritt von "'+name+'" zurücksetzen?'))return;const prog=DB.get('progress')||{};delete prog[uid];DB.set('progress',prog);showToast('Fortschritt zurückgesetzt.','info');renderManage();}
let exerciseState={};
function initExercise(mid,eid){const k=mid+'_'+eid;if(!exerciseState[k])exerciseState[k]={attempts:0,correct:false};return exerciseState[k];}
function normalizeAnswer(a){return String(a).trim().replace(/\s/g,'').replace(',','.').toLowerCase().replace('−','-').replace('–','-');}
function checkAnswer(mid,eid,userAnswer,correctAnswer,fbId,inpId){const state=initExercise(mid,eid);if(state.correct){showToast('Bereits gelöst! ✅','info');return;}state.attempts++;const ok=normalizeAnswer(userAnswer)===normalizeAnswer(correctAnswer);const fb=document.getElementById(fbId);const inp=document.getElementById(inpId);if(ok){state.correct=true;if(fb){fb.className='feedback-box correct';fb.innerHTML='✅ Richtig! Sehr gut!';fb.style.display='block';}if(inp){inp.style.borderColor='#10b981';inp.style.background='#d1fae5';inp.disabled=true;}recordAnswer(mid,eid,true);showToast('✅ Richtig!','success');}else{if(fb){fb.className='feedback-box incorrect';fb.innerHTML='❌ Leider falsch. Versuch '+state.attempts;fb.style.display='block';}if(inp){inp.style.borderColor='#ef4444';inp.style.background='#fee2e2';}recordAnswer(mid,eid,false);showToast('❌ Nicht ganz!','error');}}
function checkMC(mid,eid,val,correct,cls,fbId){const state=initExercise(mid,eid);if(state.correct)return;state.attempts++;const ok=String(val)===String(correct);document.querySelectorAll('.'+cls).forEach(el=>{el.classList.remove('correct','incorrect');if(el.dataset.val===String(val))el.classList.add(ok?'correct':'incorrect');if(!ok&&el.dataset.val===String(correct))el.classList.add('correct');});const fb=document.getElementById(fbId);if(fb){fb.className='feedback-box '+(ok?'correct':'incorrect');fb.innerHTML=ok?'✅ Richtig!':'❌ Leider falsch.';fb.style.display='block';}recordAnswer(mid,eid,ok);showToast(ok?'✅ Richtig!':'❌ Nicht ganz!',ok?'success':'error');}
function toggleHint(id,mid){const el=document.getElementById(id);if(!el)return;const h=!el.style.display||el.style.display==='none';el.style.display=h?'block':'none';if(h)recordHint(mid);}
function toggleSolution(id){const el=document.getElementById(id);if(!el)return;el.style.display=(!el.style.display||el.style.display==='none')?'block':'none';}
function buildExCard(num,question,level,content,mid,eid,hint,solution){const lc={'Basis':'background:#dbeafe;color:#1e40af','Standard':'background:#f5f3ff;color:#5b21b6','Erweitert':'background:#fce7f3;color:#9d174d'}[level]||'';const k=mid+'_'+eid;return`<div class="exercise-card"><div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;"><div style="background:#7c3aed;color:white;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;">${num}</div><div style="flex:1;font-size:16px;font-weight:600;color:#1e293b;">${question}</div><span style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;${lc};flex-shrink:0;">${level}</span></div>${content}<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;"><button onclick="toggleHint('hint_${k}','${mid}')" class="btn-hint">💡 Tipp</button><button onclick="toggleSolution('sol_${k}')" class="btn-solution">📖 Musterlösung</button></div><div id="hint_${k}" class="hint-box">${hint}</div><div id="sol_${k}" class="solution-box">${solution}</div></div>`;}
function inputField(mid,eid,correct,placeholder='Antwort'){return`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;"><input type="text" id="inp_${mid}_${eid}" placeholder="${placeholder}" style="padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:15px;width:160px;outline:none;" onkeydown="if(event.key==='Enter')checkAnswer('${mid}','${eid}',this.value,'${correct}','fb_${mid}_${eid}','inp_${mid}_${eid}')"><button onclick="checkAnswer('${mid}','${eid}',document.getElementById('inp_${mid}_${eid}').value,'${correct}','fb_${mid}_${eid}','inp_${mid}_${eid}')" class="btn-check">Prüfen</button></div><div id="fb_${mid}_${eid}" class="feedback-box"></div>`;}
function mcOptions(options,mid,eid,correct,cls){return`<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">${options.map((o,i)=>`<div class="mc-option ${cls}" data-val="${o}" onclick="checkMC('${mid}','${eid}','${o}','${correct}','${cls}','fb_${mid}_${eid}')"><span style="width:24px;height:24px;border-radius:50%;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">${String.fromCharCode(65+i)}</span>${o}</div>`).join('')}</div><div id="fb_${mid}_${eid}" class="feedback-box"></div>`;}
const helpTopics={zahlenstrahl:{title:'📏 Zahlenstrahl',content:`<div class="merkebox"><h4>Zahlenstrahl</h4><p>Negative Zahlen links von 0, positive rechts. Je weiter links, desto kleiner!</p></div><div class="beispiel-box"><h4>Gegenzahl</h4><p class="calc">Gegenzahl von −3 ist +3</p></div>`},betrag:{title:'📐 Betrag',content:`<div class="merkebox"><h4>Betrag = Abstand von 0</h4><p>|−4,6| = 4,6 | |+3| = 3 | |0| = 0</p></div>`},addieren:{title:'➕ Addieren',content:`<div class="merkebox"><h4>Vorzeichen</h4><p>Gleiche Vorzeichen: addieren. Verschiedene: subtrahieren.<br>Subtrahieren = Gegenzahl addieren.</p></div>`},multiplizieren:{title:'✖️ Multiplizieren',content:`<div class="merkebox"><h4>Vorzeichenregeln</h4><p>Gleiche Vorzeichen → + | Verschiedene → −</p></div>`},vorrang:{title:'📐 Vorrang',content:`<div class="merkebox"><h4>Reihenfolge</h4><p>1. Klammern | 2. × und ÷ | 3. + und −</p></div>`},gesetze:{title:'⚖️ Gesetze',content:`<div class="merkebox"><h4>Rechengesetze</h4><p>Kommutativ: a+b=b+a<br>Assoziativ: (a+b)+c=a+(b+c)<br>Distributiv: a×(b+c)=a×b+a×c</p></div>`}};
function openHelpModal(topic){const modal=document.getElementById('helpModal');modal.classList.add('open');const keys=Object.keys(helpTopics);const active=topic||keys[0];document.getElementById('helpTabs').innerHTML=keys.map(k=>`<button class="modal-tab ${k===active?'active':''}" onclick="showHelpTopic('${k}')">${helpTopics[k].title}</button>`).join('');showHelpTopic(active);}
function showHelpTopic(key){document.querySelectorAll('#helpTabs .modal-tab').forEach(b=>{b.classList.toggle('active',b.getAttribute('onclick')===`showHelpTopic('${key}')`)});document.getElementById('helpContent').innerHTML=helpTopics[key]?.content||'';}
function closeHelpModal(){document.getElementById('helpModal').classList.remove('open');}
function switchLessonTab(tabId){document.querySelectorAll('#view-module .lesson-content').forEach(c=>c.classList.remove('active'));document.querySelectorAll('#view-module .lesson-tab').forEach(t=>t.classList.remove('active'));const el=document.getElementById(tabId);if(el)el.classList.add('active');document.querySelectorAll('#view-module .lesson-tab').forEach(t=>{if(t.getAttribute('onclick')&&t.getAttribute('onclick').includes(tabId))t.classList.add('active');});}
function lessonHeader(title,meta){return`<div class="lesson-header"><div style="font-size:13px;opacity:.7;margin-bottom:8px;">Rationale Zahlen</div><div class="lesson-title">${title}</div><div class="lesson-meta">${meta}</div></div>`;}
function lessonTabs(mid){return`<div class="lesson-tabs"><button class="lesson-tab active" onclick="switchLessonTab('theory-${mid}')">📖 Theorie</button><button class="lesson-tab" onclick="switchLessonTab('exercises-${mid}')">✏️ Aufgaben</button><button class="lesson-tab" onclick="switchLessonTab('help-${mid}')">💡 Hilfe</button></div>`;}
function merkebox(title,content){return`<div class="merkebox"><h4>${title}</h4><p>${content}</p></div>`;}
function beispiel(title,content){return`<div class="beispiel-box"><h4>${title}</h4><p class="calc">${content}</p></div>`;}
</script>
<script>
function moduleErkennen(){const mid='erkennen';document.getElementById('moduleContent').innerHTML=lessonHeader('🔢 Rationale Zahlen erkennen und vergleichen','<span>📝 8 Aufgaben</span><span>⏱️ ca. 20 Min</span><span>📚 Seite 12–13</span>')+lessonTabs(mid)+`<div id="theory-${mid}" class="lesson-content active" style="max-width:800px;">${merkebox('Was sind rationale Zahlen?','Die Menge ℚ enthält alle Zahlen als Bruch p/q: ganze Zahlen, Brüche, Dezimalzahlen.')}${merkebox('Gegenzahl','Die Gegenzahl von a ist −a. Beide liegen gleich weit von 0 entfernt.<br>Gegenzahl von −3 ist +3 | Gegenzahl von +2,5 ist −2,5')}${merkebox('Betrag |a|','Der Betrag ist der Abstand von 0. Er ist immer ≥ 0.<br>|−4,6| = 4,6 | |+3| = 3 | |0| = 0')}${beispiel('Zahlen vergleichen','−3 &lt; −1 &lt; 0 &lt; 0,5 &lt; 2 &lt; 3,7<br>Auf dem Zahlenstrahl: weiter links = kleiner!')}${beispiel('Betrag berechnen','|−4,6| = 4,6 &nbsp;&nbsp; |+4,6| = 4,6 &nbsp;&nbsp; |−½| = 0,5')}</div><div id="exercises-${mid}" class="lesson-content" style="max-width:800px;">${buildExCard(1,'Schreibe die Gegenzahl.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) Gegenzahl von −5</div>${inputField(mid,'e1a','+5')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) Gegenzahl von +3,7</div>${inputField(mid,'e1b','-3.7')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) Gegenzahl von −½</div>${inputField(mid,'e1c','+0.5')}</div>`,mid,'e1','💡 Vorzeichen umkehren: aus − wird +, aus + wird −.','a) +5 | b) −3,7 | c) +0,5')}${buildExCard(2,'Berechne den Betrag.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) |−8|</div>${inputField(mid,'e2a','8')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) |+4,5|</div>${inputField(mid,'e2b','4.5')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) |−2,3|</div>${inputField(mid,'e2c','2.3')}</div>`,mid,'e2','💡 Betrag = Vorzeichen weglassen. Immer positiv!','a) 8 | b) 4,5 | c) 2,3')}${buildExCard(3,'Vergleiche mit < oder >.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) −3 __ −1</div>${inputField(mid,'e3a','<','< oder >')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) −0,5 __ −2</div>${inputField(mid,'e3b','>','< oder >')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) −4,8 __ +2,3</div>${inputField(mid,'e3c','<','< oder >')}</div>`,mid,'e3','💡 Zahlenstrahl: weiter links = kleiner!','a) < | b) > | c) <')}${buildExCard(4,'Welche Zahl hat den größten Betrag?','Basis',mcOptions(['−7 (Betrag: 7)','+3 (Betrag: 3)','−4,5 (Betrag: 4,5)','+6,2 (Betrag: 6,2)'],mid,'e4','−7 (Betrag: 7)','mc_e4'),mid,'e4','💡 Berechne alle Beträge und vergleiche.','|−7|=7 ist der größte Betrag.')}${buildExCard(5,'Temperatur: An welchem Tag war es am kältesten?','Standard',`<div style="background:#f8fafc;padding:12px 16px;border-radius:8px;border-left:3px solid #a78bfa;font-size:13px;color:#64748b;margin-bottom:16px;">Mo:−4,8°C | Di:−2,1°C | Mi:+0,5°C | Do:+2,3°C | Fr:−1,2°C</div>${inputField(mid,'e5','montag','Wochentag')}`,mid,'e5','💡 Kältester Tag = kleinste Temperatur.','Montag: −4,8°C')}${buildExCard(6,'Kontostand: Welches Konto hat den niedrigsten Stand?','Standard',mcOptions(['−5,32 €','+13,34 €','−20 €','−5,99 €'],mid,'e6','−20 €','mc_e6'),mid,'e6','💡 Niedrigster Stand = kleinste Zahl.','−20 € ist der niedrigste Stand.')}${buildExCard(7,'Ordne von klein nach groß (Semikolon-getrennt).','Standard',`<div style="background:#f8fafc;padding:12px 16px;border-radius:8px;border-left:3px solid #a78bfa;font-size:13px;color:#64748b;margin-bottom:16px;">−3; +1,5; −0,5; +4; −2; 0</div>${inputField(mid,'e7','-3;-2;-0.5;0;1.5;4','z.B. −3; −2; ...')}`,mid,'e7','💡 Negative Zahlen sind kleiner als 0.','−3 < −2 < −0,5 < 0 < 1,5 < 4')}${buildExCard(8,'In welchem Quadranten liegt B(1|−2)?','Erweitert',mcOptions(['I. Quadrant (x>0, y>0)','II. Quadrant (x<0, y>0)','III. Quadrant (x<0, y<0)','IV. Quadrant (x>0, y<0)'],mid,'e8','IV. Quadrant (x>0, y<0)','mc_e8'),mid,'e8','💡 B(1|−2): x=+1 (rechts), y=−2 (unten).','IV. Quadrant: x>0 und y<0.')}</div><div id="help-${mid}" class="lesson-content" style="max-width:800px;">${helpTopics.zahlenstrahl.content}${helpTopics.betrag.content}</div>`;}

function moduleAddieren(){const mid='addieren';document.getElementById('moduleContent').innerHTML=lessonHeader('➕ Rationale Zahlen addieren und subtrahieren','<span>📝 8 Aufgaben</span><span>⏱️ ca. 25 Min</span><span>📚 Seite 14–15</span>')+lessonTabs(mid)+`<div id="theory-${mid}" class="lesson-content active" style="max-width:800px;">${merkebox('Gleiche Vorzeichen addieren','(+3)+(+5)=+8 | (−3)+(−5)=−8<br>Beträge addieren, Vorzeichen behalten')}${merkebox('Verschiedene Vorzeichen addieren','(−7)+(+4)=−3 | Beträge subtrahieren, Vorzeichen der größeren Zahl')}${merkebox('Subtrahieren = Gegenzahl addieren','(−1,2)−(+2,6) = (−1,2)+(−2,6) = −3,8')}${beispiel('Beispiele','(−1,2)+(−2,6) = −3,8<br>(−1,2)+(+2,6) = +1,4<br>(−4)−(−2) = (−4)+(+2) = −2')}</div><div id="exercises-${mid}" class="lesson-content" style="max-width:800px;">${buildExCard(1,'Berechne.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−3)+(−5)</div>${inputField(mid,'a1a','-8')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (+4)+(−7)</div>${inputField(mid,'a1b','-3')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) (−2,5)+(+6)</div>${inputField(mid,'a1c','3.5')}</div>`,mid,'a1','💡 Gleiche Vorzeichen: addieren. Verschiedene: subtrahieren.','a) −8 | b) −3 | c) +3,5')}${buildExCard(2,'Berechne (Subtrahieren).','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−4)−(−2)</div>${inputField(mid,'a2a','-2')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (+3)−(+8)</div>${inputField(mid,'a2b','-5')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) (−1,5)−(−3)</div>${inputField(mid,'a2c','1.5')}</div>`,mid,'a2','💡 a−b = a+(−b)','a) −2 | b) −5 | c) +1,5')}${buildExCard(3,'Thermometer: −4°C, steigt um 3,5°C. Neue Temperatur?','Standard',inputField(mid,'a3','-0.5','°C'),mid,'a3','💡 (−4)+(+3,5)=?','(−4)+(+3,5) = −0,5°C')}${buildExCard(4,'Berechne.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) −3,5+2−(−1)</div>${inputField(mid,'a4a','-0.5')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) 5−(+3)+(−4)</div>${inputField(mid,'a4b','-2')}</div>`,mid,'a4','💡 Schritt für Schritt von links nach rechts.','a) −0,5 | b) −2')}${buildExCard(5,'Kontostand: −15€, +20€, −10€. Neuer Stand?','Standard',inputField(mid,'a5','-5','€'),mid,'a5','💡 (−15)+(+20)+(−10)=?','(−15)+(+20)+(−10) = −5€')}${buildExCard(6,'Berechne mit Brüchen.','Erweitert',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−¾)+(+¼)</div>${inputField(mid,'a6a','-0.5','Dezimalzahl')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−½)−(+¾)</div>${inputField(mid,'a6b','-1.25','Dezimalzahl')}</div>`,mid,'a6','💡 ¾=0,75 | ¼=0,25 | ½=0,5','a) −0,5 | b) −1,25')}${buildExCard(7,'Berechne: (−8)+(+3)','Basis',mcOptions(['+11','+5','−5','−11'],mid,'a7','−5','mc_a7'),mid,'a7','💡 |−8|>|+3|: 8−3=5, Vorzeichen −.','(−8)+(+3) = −5')}${buildExCard(8,'Taucher: −12m, taucht 4,5m tiefer. Neue Tiefe?','Erweitert',inputField(mid,'a8','-16.5','m'),mid,'a8','💡 (−12)+(−4,5)=?','(−12)+(−4,5) = −16,5m')}</div><div id="help-${mid}" class="lesson-content" style="max-width:800px;">${helpTopics.addieren.content}</div>`;}

function moduleMultiplizieren(){const mid='multiplizieren';document.getElementById('moduleContent').innerHTML=lessonHeader('✖️ Rationale Zahlen multiplizieren und dividieren','<span>📝 8 Aufgaben</span><span>⏱️ ca. 25 Min</span><span>📚 Seite 16–18</span>')+lessonTabs(mid)+`<div id="theory-${mid}" class="lesson-content active" style="max-width:800px;">${merkebox('Vorzeichenregeln','Gleiche Vorzeichen → Ergebnis positiv (+)<br>Verschiedene Vorzeichen → Ergebnis negativ (−)')}<table class="sign-table"><tr><th>× oder ÷</th><th>Positiv (+)</th><th>Negativ (−)</th></tr><tr><td>Positiv (+)</td><td class="pos">+</td><td class="neg">−</td></tr><tr><td>Negativ (−)</td><td class="neg">−</td><td class="pos">+</td></tr></table>${beispiel('Beispiele','(−3)×(−4) = +12 (gleich → +)<br>(−3)×(+4) = −12 (verschieden → −)<br>(−8)÷(−2) = +4 (gleich → +)')}</div><div id="exercises-${mid}" class="lesson-content" style="max-width:800px;">${buildExCard(1,'Berechne die Produkte.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−4)×(+3)</div>${inputField(mid,'m1a','-12')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−5)×(−6)</div>${inputField(mid,'m1b','30')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) (+2,5)×(−4)</div>${inputField(mid,'m1c','-10')}</div>`,mid,'m1','💡 Gleiche Vorzeichen → +, verschiedene → −.','a) −12 | b) +30 | c) −10')}${buildExCard(2,'Berechne die Quotienten.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−12)÷(+4)</div>${inputField(mid,'m2a','-3')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−15)÷(−3)</div>${inputField(mid,'m2b','5')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) (+7,2)÷(−8)</div>${inputField(mid,'m2c','-0.9')}</div>`,mid,'m2','💡 Gleiche Vorzeichen → +, verschiedene → −.','a) −3 | b) +5 | c) −0,9')}${buildExCard(3,'Mehrere Faktoren.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−2)×(−3)×(+4)</div>${inputField(mid,'m3a','24')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−1)×(−2)×(−3)</div>${inputField(mid,'m3b','-6')}</div>`,mid,'m3','💡 Gerade Anzahl negativer Faktoren → +, ungerade → −.','a) +24 | b) −6')}${buildExCard(4,'Welches Vorzeichen?','Basis',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−3)×(−5)×(−2)</div>${inputField(mid,'m4a','-','+ oder −')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−4)×(−2)×(−1)×(−3)</div>${inputField(mid,'m4b','+','+ oder −')}</div>`,mid,'m4','💡 Ungerade Anzahl negativer Faktoren → −, gerade → +.','a) − | b) +')}${buildExCard(5,'Familie Krolis: −120€/Monat. Wie viel in 3 Monaten?','Standard',inputField(mid,'m5','-360','€'),mid,'m5','💡 3×(−120)=?','3×(−120) = −360€')}${buildExCard(6,'Berechne.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−0,5)×(+8)</div>${inputField(mid,'m6a','-4')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−4,4)÷(+4,4)</div>${inputField(mid,'m6b','-1')}</div>`,mid,'m6','💡 Vorzeichen bestimmen, dann Beträge rechnen.','a) −4 | b) −1')}${buildExCard(7,'Taucher: −2,5m/min. Tiefe nach 6 Minuten?','Erweitert',inputField(mid,'m7','-15','m'),mid,'m7','💡 6×(−2,5)=?','6×(−2,5) = −15m')}${buildExCard(8,'Berechne: (−6)÷(−2)','Basis',mcOptions(['+3','−3','+12','−12'],mid,'m8','+3','mc_m8'),mid,'m8','💡 Gleiche Vorzeichen → +.','(−6)÷(−2) = +3')}</div><div id="help-${mid}" class="lesson-content" style="max-width:800px;">${helpTopics.multiplizieren.content}</div>`;}

function moduleVorrang(){const mid='vorrang';document.getElementById('moduleContent').innerHTML=lessonHeader('📐 Rechenregeln und Vorrangregeln','<span>📝 7 Aufgaben</span><span>⏱️ ca. 20 Min</span><span>📚 Seite 20–21</span>')+lessonTabs(mid)+`<div id="theory-${mid}" class="lesson-content active" style="max-width:800px;">${merkebox('Reihenfolge','1. Klammern | 2. × und ÷ | 3. + und −<br>"Punkt vor Strich" und "Klammern zuerst"!')}${beispiel('Punkt vor Strich','−3+4×(−2) = −3+(−8) = −11')}${beispiel('Klammern zuerst','(−3+4)×(−2) = 1×(−2) = −2')}</div><div id="exercises-${mid}" class="lesson-content" style="max-width:800px;">${buildExCard(1,'Berechne (Punkt vor Strich).','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) −3+4×(−2)</div>${inputField(mid,'v1a','-11')}</div><div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) 5−2×(−3)</div>${inputField(mid,'v1b','11')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">c) (−8)÷4+(−1)</div>${inputField(mid,'v1c','-3')}</div>`,mid,'v1','💡 Erst × und ÷, dann + und −.','a) −11 | b) +11 | c) −3')}${buildExCard(2,'Berechne (Klammern zuerst).','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−3+4)×(−2)</div>${inputField(mid,'v2a','-2')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−5−1)÷(−2)</div>${inputField(mid,'v2b','3')}</div>`,mid,'v2','💡 Klammern immer zuerst!','a) −2 | b) +3')}${buildExCard(3,'Gemischte Terme.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) 2×(−3)+(−4)÷2</div>${inputField(mid,'v3a','-8')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−4,5+0,5+(−2))÷3</div>${inputField(mid,'v3b','-2')}</div>`,mid,'v3','💡 1. Klammern, 2. × und ÷, 3. + und −.','a) −8 | b) −2')}${buildExCard(4,'Temperaturdurchschnitt: (−4,5+0,5+(−2))÷3','Standard',inputField(mid,'v4','-2','°C'),mid,'v4','💡 Erst Klammer: −6, dann ÷3.','(−6)÷3 = −2°C')}${buildExCard(5,'Pascal rechnet falsch. Richtig?','Erweitert',mcOptions(['Ja, richtig','Nein, falsch – Punkt vor Strich!'],mid,'v5','Nein, falsch – Punkt vor Strich!','mc_v5'),mid,'v5','💡 Was muss zuerst berechnet werden?','Falsch! Richtig: −2+3×(−4) = −2+(−12) = −14')}${buildExCard(6,'Berechne.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) −1,5×(−2)−3×(+1)</div>${inputField(mid,'v6a','0')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−2)²+(−3)×2</div>${inputField(mid,'v6b','-2')}</div>`,mid,'v6','💡 (−2)²=(−2)×(−2)=+4.','a) 0 | b) −2')}${buildExCard(7,'Laden: 3 Kisten (−5€) + 8 Flaschen (−0,5€).','Erweitert',inputField(mid,'v7','-19','€'),mid,'v7','💡 (−3)×5+(−8)×0,5=?','(−15)+(−4) = −19€')}</div><div id="help-${mid}" class="lesson-content" style="max-width:800px;">${helpTopics.vorrang.content}</div>`;}

function moduleGesetze(){const mid='gesetze';document.getElementById('moduleContent').innerHTML=lessonHeader('⚖️ Rechengesetze bei rationalen Zahlen','<span>📝 6 Aufgaben</span><span>⏱️ ca. 20 Min</span><span>📚 Seite 22–23</span>')+lessonTabs(mid)+`<div id="theory-${mid}" class="lesson-content active" style="max-width:800px;">${merkebox('Kommutativgesetz','a+b = b+a | a×b = b×a')}${merkebox('Assoziativgesetz','(a+b)+c = a+(b+c)')}${merkebox('Distributivgesetz','a×(b+c) = a×b + a×c')}${beispiel('Beispiele','(−2)×(3+(−5)) = (−2)×3+(−2)×(−5) = −6+10 = 4<br>(−¼)×4×(−8) = (−¼)×(−8)×4 = 2×4 = 8')}</div><div id="exercises-${mid}" class="lesson-content" style="max-width:800px;">${buildExCard(1,'Gilt: (−5)+(+8) = (+8)+(−5)?','Basis',mcOptions(['Ja','Nein'],mid,'g1','Ja','mc_g1'),mid,'g1','💡 Kommutativgesetz: a+b=b+a.','Ja! Kommutativgesetz.')}${buildExCard(2,'Distributivgesetz anwenden.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−3)×(4+(−2))</div>${inputField(mid,'g2a','-6')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−2)×(3+(−5))</div>${inputField(mid,'g2b','4')}</div>`,mid,'g2','💡 Klammer zuerst oder Distributivgesetz.','a) −6 | b) +4')}${buildExCard(3,'Rechenvorteil nutzen.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−¼)×4×(−8)</div>${inputField(mid,'g3a','8')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−0,5)×7×(−2)</div>${inputField(mid,'g3b','7')}</div>`,mid,'g3','💡 Tausche Reihenfolge: (−¼)×(−8)=2, dann 2×4=8.','a) 8 | b) 7')}${buildExCard(4,'Welches Gesetz?','Basis',`<div style="margin-bottom:16px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−3)×(2+5) = (−3)×2+(−3)×5</div>${mcOptions(['Kommutativgesetz','Assoziativgesetz','Distributivgesetz'],mid,'g4a','Distributivgesetz','mc_g4a')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−2+5)+(−3) = (−2)+(5+(−3))</div>${mcOptions(['Kommutativgesetz','Assoziativgesetz','Distributivgesetz'],mid,'g4b','Assoziativgesetz','mc_g4b')}</div>`,mid,'g4','💡 Distributiv=verteilen | Assoziativ=Klammern | Kommutativ=tauschen.','a) Distributivgesetz | b) Assoziativgesetz')}${buildExCard(5,'Berechne geschickt.','Erweitert',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−4)×99</div>${inputField(mid,'g5a','-396')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−3)×101</div>${inputField(mid,'g5b','-303')}</div>`,mid,'g5','💡 (−4)×(100−1) = −400+4 = −396.','a) −396 | b) −303')}${buildExCard(6,'Berechne.','Standard',`<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">a) (−2,5)×4×(−3)</div>${inputField(mid,'g6a','30')}</div><div><div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:8px;">b) (−5)×(−3+(−7))</div>${inputField(mid,'g6b','50')}</div>`,mid,'g6','💡 a): (−2,5)×4=−10, dann (−10)×(−3)=+30.','a) +30 | b) +50')}</div><div id="help-${mid}" class="lesson-content" style="max-width:800px;">${helpTopics.gesetze.content}</div>`;}
</script>
<script>
const lcQ=[{id:'lc1',topic:'Erkennen',q:'Was ist die Gegenzahl von −4,5?',type:'mc',opts:['+4,5','−4,5','+0,5','−0,5'],correct:'+4,5',hint:'Vorzeichen umkehren.',sol:'Gegenzahl von −4,5 ist +4,5'},{id:'lc2',topic:'Betrag',q:'Berechne: |−7,3|',type:'input',correct:'7.3',hint:'Betrag = Abstand von 0.',sol:'|−7,3| = 7,3'},{id:'lc3',topic:'Vergleichen',q:'Welche Zahl ist kleiner: −0,5 oder −2?',type:'mc',opts:['−0,5','−2','Beide gleich'],correct:'−2',hint:'Zahlenstrahl: weiter links = kleiner.',sol:'−2 < −0,5'},{id:'lc4',topic:'Addieren',q:'Berechne: (−3,5)+(+1,5)',type:'input',correct:'-2',hint:'Verschiedene Vorzeichen.',sol:'(−3,5)+(+1,5) = −2'},{id:'lc5',topic:'Subtrahieren',q:'Berechne: (−4)−(−6)',type:'input',correct:'2',hint:'a−b = a+(−b)',sol:'(−4)+(+6) = +2'},{id:'lc6',topic:'Multiplizieren',q:'Berechne: (−3)×(−7)',type:'input',correct:'21',hint:'Gleiche Vorzeichen → +.',sol:'(−3)×(−7) = +21'},{id:'lc7',topic:'Dividieren',q:'Berechne: (−18)÷(+3)',type:'input',correct:'-6',hint:'Verschiedene Vorzeichen → −.',sol:'(−18)÷(+3) = −6'},{id:'lc8',topic:'Vorrang',q:'Berechne: −2+3×(−4)',type:'mc',opts:['−14','+4','−4','+14'],correct:'−14',hint:'Punkt vor Strich!',sol:'−2+(−12) = −14'},{id:'lc9',topic:'Klammern',q:'Berechne: (−2+5)×(−3)',type:'input',correct:'-9',hint:'Klammern zuerst.',sol:'3×(−3) = −9'},{id:'lc10',topic:'Gesetze',q:'Welches Gesetz: (−3)×(2+5)=(−3)×2+(−3)×5?',type:'mc',opts:['Kommutativgesetz','Assoziativgesetz','Distributivgesetz'],correct:'Distributivgesetz',hint:'Welches Gesetz verteilt × über +?',sol:'Distributivgesetz'}];
let lcState={current:0,answers:[],startTime:null};let lcSelected=null;
function moduleLerncheck(){lcState={current:0,answers:[],startTime:Date.now()};document.getElementById('moduleContent').innerHTML=`<div class="lesson-header"><div style="font-size:13px;opacity:.7;margin-bottom:8px;">Rationale Zahlen</div><div class="lesson-title">✅ Lerncheck</div><div class="lesson-meta"><span>📝 10 Fragen</span><span>⏱️ ca. 15 Min</span></div></div><div style="max-width:700px;"><div style="background:white;border-radius:12px;padding:20px 24px;box-shadow:var(--shadow);margin-bottom:24px;display:flex;align-items:center;gap:20px;"><div id="lc-qnum" style="font-size:13px;color:#64748b;white-space:nowrap;">Frage 1/10</div><div class="lerncheck-bar"><div class="lerncheck-bar-fill" id="lc-bar" style="width:0%"></div></div><div id="lc-score" style="font-size:13px;color:#64748b;">0/0</div></div><div id="lc-area"></div></div>`;renderLCQ();}
function renderLCQ(){const q=lcQ[lcState.current];const pct=(lcState.current/lcQ.length)*100;document.getElementById('lc-bar').style.width=pct+'%';document.getElementById('lc-qnum').textContent='Frage '+(lcState.current+1)+'/'+lcQ.length;const correct=lcState.answers.filter(a=>a.correct).length;document.getElementById('lc-score').textContent=correct+'/'+lcState.current;lcSelected=null;let inputHtml='';if(q.type==='input'){inputHtml=`<div style="display:flex;align-items:center;gap:12px;margin-top:16px;"><input type="text" id="lc-inp" placeholder="Antwort" style="padding:12px 16px;border:2px solid #e2e8f0;border-radius:8px;font-size:18px;width:200px;outline:none;" onkeydown="if(event.key==='Enter')submitLC()"><button onclick="submitLC()" class="btn-check" style="padding:12px 24px;font-size:15px;">Antworten →</button></div>`;}else{inputHtml=`<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;" id="lc-opts">${q.opts.map((o,i)=>`<div data-val="${o}" onclick="selectLC('${o.replace(/'/g,"\\'")}',this)" style="display:flex;align-items:center;gap:12px;padding:14px 18px;border:2px solid #e2e8f0;border-radius:8px;cursor:pointer;font-size:15px;"><span style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">${String.fromCharCode(65+i)}</span>${o}</div>`).join('')}</div><button id="lc-mc-btn" onclick="submitLC()" class="btn-check" style="display:none;margin-top:16px;padding:12px 24px;font-size:15px;">Antworten →</button>`;}document.getElementById('lc-area').innerHTML=`<div class="exercise-card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;"><span style="background:#7c3aed;color:white;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;">${q.topic}</span><span style="font-size:13px;color:#64748b;">Frage ${lcState.current+1}</span></div><div style="font-size:20px;font-weight:700;color:#0f172a;margin-bottom:8px;line-height:1.4;">${q.q}</div>${inputHtml}<div id="lc-fb" class="feedback-box" style="margin-top:16px;font-size:15px;"></div><div id="lc-hint-box" class="hint-box"></div><div style="display:flex;gap:10px;margin-top:16px;"><button onclick="showLCHint()" class="btn-hint">💡 Tipp</button></div><div id="lc-next" style="display:none;margin-top:20px;"><button onclick="nextLC()" class="btn-primary" style="width:auto;padding:12px 32px;">${lcState.current<lcQ.length-1?'Nächste Frage →':'Auswertung →'}</button></div></div>`;if(q.type==='input')setTimeout(()=>{const i=document.getElementById('lc-inp');if(i)i.focus();},100);}
function selectLC(val,el){lcSelected=val;document.querySelectorAll('#lc-opts [data-val]').forEach(e=>{e.style.borderColor='#e2e8f0';e.style.background='white';});el.style.borderColor='#7c3aed';el.style.background='#f5f3ff';const btn=document.getElementById('lc-mc-btn');if(btn)btn.style.display='inline-block';}
function submitLC(){const q=lcQ[lcState.current];let ans='';if(q.type==='input'){const i=document.getElementById('lc-inp');if(!i||!i.value.trim()){showToast('Bitte Antwort eingeben!','error');return;}ans=i.value.trim();}else{if(!lcSelected){showToast('Bitte auswählen!','error');return;}ans=lcSelected;}const norm=s=>String(s).trim().replace(/\s/g,'').replace(',','.').toLowerCase().replace('−','-').replace('–','-');const ok=norm(ans)===norm(q.correct);lcState.answers.push({id:q.id,ans,correct:ok});const fb=document.getElementById('lc-fb');if(fb){fb.className='feedback-box '+(ok?'correct':'incorrect');fb.innerHTML=(ok?'✅ Richtig! ':'❌ Falsch. Richtig: <strong>'+q.correct+'</strong><br>')+q.sol;fb.style.display='block';}if(q.type==='mc'){document.querySelectorAll('#lc-opts [data-val]').forEach(el=>{if(el.dataset.val===q.correct){el.style.borderColor='#10b981';el.style.background='#d1fae5';}else if(el.dataset.val===ans&&!ok){el.style.borderColor='#ef4444';el.style.background='#fee2e2';}});}else{const i=document.getElementById('lc-inp');if(i){i.style.borderColor=ok?'#10b981':'#ef4444';i.style.background=ok?'#d1fae5':'#fee2e2';i.disabled=true;}}document.querySelectorAll('#lc-area button').forEach(b=>{if(b.textContent.includes('Antworten'))b.disabled=true;});const nb=document.getElementById('lc-next');if(nb)nb.style.display='block';recordAnswer('lerncheck',q.id,ok);showToast(ok?'✅ Richtig!':'❌ Falsch',ok?'success':'error');lcSelected=null;}
function showLCHint(){const q=lcQ[lcState.current];const h=document.getElementById('lc-hint-box');if(h){h.innerHTML='💡 '+q.hint;h.style.display=h.style.display==='block'?'none':'block';}}
function nextLC(){lcState.current++;lcSelected=null;if(lcState.current>=lcQ.length)showLCResult();else renderLCQ();}
function showLCResult(){const correct=lcState.answers.filter(a=>a.correct).length;const total=lcQ.length;const pct=Math.round(correct/total*100);const elapsed=Math.round((Date.now()-lcState.startTime)/1000);const mins=Math.floor(elapsed/60);const secs=elapsed%60;let emoji='😔',label='Weiter üben!';if(pct>=90){emoji='🏆';label='Ausgezeichnet!';}else if(pct>=70){emoji='🌟';label='Sehr gut!';}else if(pct>=50){emoji='👍';label='Gut gemacht!';}document.getElementById('lc-bar').style.width='100%';document.getElementById('lc-area').innerHTML=`<div class="exercise-card" style="text-align:center;padding:40px;"><div style="font-size:64px;margin-bottom:16px;">${emoji}</div><div style="font-size:48px;font-weight:900;color:#7c3aed;">${pct}%</div><div style="font-size:18px;color:#64748b;margin-bottom:24px;">${label}</div><div style="display:flex;justify-content:center;gap:32px;margin-bottom:32px;"><div style="text-align:center;"><div style="font-size:24px;font-weight:800;color:#10b981;">${correct}</div><div style="font-size:12px;color:#64748b;">Richtig</div></div><div style="text-align:center;"><div style="font-size:24px;font-weight:800;color:#ef4444;">${total-correct}</div><div style="font-size:12px;color:#64748b;">Falsch</div></div><div style="text-align:center;"><div style="font-size:24px;font-weight:800;color:#3b82f6;">${mins}:${String(secs).padStart(2,'0')}</div><div style="font-size:12px;color:#64748b;">Zeit</div></div></div><div style="background:#f8fafc;border-radius:12px;padding:20px;margin-bottom:24px;text-align:left;"><div style="font-size:14px;font-weight:700;color:#334155;margin-bottom:12px;">📋 Detailauswertung</div>${lcState.answers.map((a,i)=>{const q=lcQ[i];return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e2e8f0;"><span style="font-size:16px;">${a.correct?'✅':'❌'}</span><div style="flex:1;"><div style="font-size:13px;font-weight:600;">${q.topic}: ${q.q}</div>${!a.correct?`<div style="font-size:12px;color:#ef4444;">Deine Antwort: ${a.ans} → Richtig: ${q.correct}</div>`:''}</div></div>`;}).join('')}</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button onclick="moduleLerncheck()" class="btn-primary" style="width:auto;padding:12px 24px;">🔄 Nochmal</button><button onclick="showView('dashboard')" class="btn-secondary">🏠 Dashboard</button></div></div>`;if(currentUser){const all=DB.get('progress')||{};if(!all[currentUser.id])all[currentUser.id]={};all[currentUser.id]['lerncheck']={correct,total,percent:pct,attempts:total,errors:total-correct,exercises:Object.fromEntries(lcState.answers.filter(a=>a.correct).map(a=>[a.id,true]))};DB.set('progress',all);updateSidebarProgress();}}
document.addEventListener('DOMContentLoaded',()=>{
  initDB();
  ['regFirstname','regLastname'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{const fn=document.getElementById('regFirstname').value.trim();const ln=document.getElementById('regLastname').value.trim();if(fn&&ln)document.getElementById('regUsername').value=(fn+'.'+ln).toLowerCase().replace(/\s/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');});});
  ['loginUsername','loginPassword'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});});
});
</script>
